name: Deploy Production

on:
  push:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH and SCP
        uses: appleboy/ssh-action@master
        env:
          ALLOW_ORIGIN: ${{ secrets.ALLOW_ORIGIN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USERNAME }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: ALLOW_ORIGIN
          script: |
            nvm use v21.1.0
            export PATH="/root/.nvm/versions/node/v21.1.0/bin:$PATH"
            cd /home/ubuntu/foody-api-nestjs
            git fetch origin
            git reset --hard origin/main
            touch .env
            if grep -q '^ALLOW_ORIGIN=' .env; then
              sed -i "s|^ALLOW_ORIGIN=.*|ALLOW_ORIGIN=${ALLOW_ORIGIN}|" .env
            else
              echo "ALLOW_ORIGIN=${ALLOW_ORIGIN}" >> .env
            fi
            yarn install
            yarn build
            pm2 restart foody-api
